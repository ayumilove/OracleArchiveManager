# 持续集成：推送/PR 自动运行单元测试
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: 单元测试 (Windows / Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      # GitHub Runner 直连官方源，避免清华镜像跨境不稳定
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: 运行单元测试
        run: uv run pytest tests/unit -q
