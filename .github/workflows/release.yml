# 发布流水线：推送 v* 标签后自动编译 Windows 单文件 exe 并发布 GitHub Release
# 客户端 OTA 检查依赖该 Release（见 docs/12_RELEASE_DEPLOYMENT.md §8/§9）
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build-windows:
    name: Nuitka 编译 (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: 注入标签版本号（写回 __init__.py 并导出给 Nuitka）
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME -replace '^v',''
          $p = 'src/oracle_archive_manager/__init__.py'
          $c = Get-Content $p -Raw
          $c = $c -replace '__version__ = ".*"', ('__version__ = "' + $v + '"')
          Set-Content $p $c -NoNewline
          # Windows 版本信息必须为四段数字（x.x.x.x），不足补 0
          $parts = @($v.Split('.'))
          while ($parts.Count -lt 4) { $parts += '0' }
          $fv = ($parts | Select-Object -First 4) -join '.'
          "BUILD_VERSION=$fv" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version -> $v (file version $fv)"

      - name: 编译前单元测试
        run: uv run pytest tests/unit -q

      - name: 生成 Windows 图标（SVG → 多尺寸 ICO）
        shell: bash
        run: |
          uv pip install cairosvg pillow
          cat > svg2ico.py << 'PYEOF'
          import cairosvg, io
          from PIL import Image
          sizes = [(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)]
          svg = open('src/oracle_archive_manager/resources/icons/app.svg','rb').read()
          imgs = []
          for w,h in sizes:
              png = cairosvg.svg2png(bytestring=svg, output_width=w, output_height=h)
              imgs.append(Image.open(io.BytesIO(png)).convert('RGBA'))
          imgs[0].save('app.ico', format='ICO', sizes=[(i.width,i.height) for i in imgs], append_images=imgs[1:])
          print('app.ico created')
          PYEOF
          python svg2ico.py

      - name: Nuitka 编译单文件（整包编译 + -m 入口，保留相对导入上下文）
        run: >
          uv run python -m nuitka src/oracle_archive_manager
          --standalone --onefile
          --python-flag=-m
          --enable-plugin=pyside6
          --include-data-dir=src/oracle_archive_manager/resources=oracle_archive_manager/resources
          --windows-console-mode=disable
          --windows-icon-from-ico=app.ico
          --company-name="Oracle Archive Manager"
          --product-name="Oracle Archive Manager"
          --file-description="Oracle 历史数据归档与安全管理工具"
          --product-version=${{ env.BUILD_VERSION }}
          --file-version=${{ env.BUILD_VERSION }}
          --windows-company-name="Oracle Archive Manager"
          --windows-product-name="Oracle Archive Manager"
          --windows-file-description="Oracle Archive Manager"
          --assume-yes-for-downloads
          --remove-output
          --output-dir=dist
          --output-filename=OracleArchiveManager.exe

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: OracleArchiveManager-${{ github.ref_name }}
          path: dist/OracleArchiveManager.exe

      - name: VirusTotal 扫描
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: dist/OracleArchiveManager.exe
          update_release: false

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OracleArchiveManager.exe
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## 运行要求

            - Windows 10/11 **64 位**（本程序为 x64 构建，不支持 32 位系统）；
            - Thick Mode（Oracle 11g）需安装 **64 位** Oracle Instant Client，程序会在连接前自动检测位数并提示。
